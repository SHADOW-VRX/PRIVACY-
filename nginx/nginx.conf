# PRIVACY Chat - Load Balancer Configuration
# This config enables running multiple Node.js instances behind NGINX

upstream privacy_nodes {
    # ip_hash enables sticky sessions (required for Socket.IO)
    ip_hash;
    
    # Add your Node.js instances here
    # To run multiple instances: npm run cluster (or manually start on different ports)
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    # Add more as needed
}

server {
    listen 80;
    server_name _;  # Replace with your domain: privacy.example.com
    
    # Increase max body size for file uploads
    client_max_body_size 10M;
    
    location / {
        proxy_pass http://privacy_nodes;
        proxy_http_version 1.1;
        
        # WebSocket support (required for Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable caching for WebSocket
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings for long-lived connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check endpoint
    location /api/health {
        proxy_pass http://privacy_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

